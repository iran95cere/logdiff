[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "logdiff"
version = "0.1.0"
description = "Diff structured JSON log files and surface meaningful field-level changes across deployments."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

[project.scripts]
logdiff = "logdiff.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B", "I"]
